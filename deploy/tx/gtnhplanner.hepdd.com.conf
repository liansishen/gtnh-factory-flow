proxy_cache_path /var/cache/nginx/gtnhplanner-assets levels=1:2 keys_zone=gtnhplanner_assets:10m max_size=2g inactive=30d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name gtnhplanner.hepdd.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gtnhplanner.hepdd.com;

    include /etc/nginx/snippets/ssl-wildcard.conf;
    client_max_body_size 4m;
    access_log /var/log/nginx/gtnhplanner.hepdd.com.access.log;
    error_log /var/log/nginx/gtnhplanner.hepdd.com.error.log;

    location ~ ^/datasets/gtnh/[A-Za-z0-9._-]+/textures/.*\.(png|webp|jpe?g|gif)$ {
        root /opt/gtnh-factory-flow/shared/public;
        try_files $uri @gtnhplanner_texture_origin;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location @gtnhplanner_texture_origin {
        proxy_pass https://gtnhplanner.com;
        proxy_set_header Host gtnhplanner.com;
        proxy_ssl_server_name on;
        proxy_ssl_name gtnhplanner.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_cache gtnhplanner_assets;
        proxy_cache_lock on;
        proxy_cache_valid 200 365d;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-GTNH-Asset-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://127.0.0.1:3180;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-Ip $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
