proxy_cache_path /var/cache/nginx/gtnh-planner levels=1:2 keys_zone=gtnh_planner_assets:4m max_size=512m inactive=30d use_temp_path=off;

upstream gtnh_planner_de {
    server 127.0.0.1:13180;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name plan.playgtnh.dpdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/gtnh-planner;
        try_files $uri =404;
    }

    location / {
        return 301 https://plan.playgtnh.dpdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plan.playgtnh.dpdns.org;

    ssl_certificate /etc/letsencrypt/live/plan.playgtnh.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plan.playgtnh.dpdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GTNH_TLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 4m;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json application/wasm;
    access_log /var/log/nginx/gtnh-planner.access.log;
    error_log /var/log/nginx/gtnh-planner.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-GTNH-Ingress DeVPS always;
    add_header X-GTNH-Asset-Cache $upstream_cache_status always;

    location ~ ^/api/datasets/[^/]+/prewarm/?$ {
        return 404;
    }

    location ~ ^/datasets/gtnh/local-2\.9\.0-rc-2/textures/.*\.(png|webp|jpe?g|gif)$ {
        proxy_pass http://gtnh_planner_de;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @gtnh_planner_texture_origin;
    }

    location @gtnh_planner_texture_origin {
        proxy_pass https://gtnhplanner.com;
        proxy_set_header Host gtnhplanner.com;
        proxy_set_header User-Agent "Mozilla/5.0 GTNH-Factory-Flow-Dataset/1.0";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_ssl_server_name on;
        proxy_ssl_name gtnhplanner.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_hide_header Set-Cookie;
        proxy_hide_header NEL;
        proxy_hide_header Report-To;
        proxy_cache gtnh_planner_assets;
        proxy_cache_lock on;
        proxy_cache_valid 200 365d;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    location / {
        proxy_pass http://gtnh_planner_de;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-Ip $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
